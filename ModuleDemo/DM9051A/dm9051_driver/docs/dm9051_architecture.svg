<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <style>
    .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:6}
    .core{fill:#ecfeff;stroke:#0e7490;stroke-width:2;rx:6}
    .hal{fill:#fefce8;stroke:#a16207;stroke-width:2;rx:6}
    .chip{fill:#f0fdf4;stroke:#15803d;stroke-width:2;rx:6}
    .warn{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:6}
    .t{font:16px Arial, sans-serif;fill:#111827}
    .s{font:13px Arial, sans-serif;fill:#374151}
    .a{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs>
  <rect class="box" x="430" y="30" width="240" height="64"/><text class="t" x="550" y="58" text-anchor="middle">Application</text><text class="s" x="550" y="80" text-anchor="middle">main loop, IP/MAC, link poll</text>
  <rect class="box" x="170" y="145" width="260" height="74"/><text class="t" x="300" y="174" text-anchor="middle">uIP Adapter</text><text class="s" x="300" y="197" text-anchor="middle">uip_buf, ARP, periodic poll</text>
  <rect class="box" x="670" y="145" width="260" height="74"/><text class="t" x="800" y="174" text-anchor="middle">lwIP Adapter</text><text class="s" x="800" y="197" text-anchor="middle">netif, pbuf, NO_SYS=1</text>
  <rect class="core" x="370" y="285" width="360" height="92"/><text class="t" x="550" y="318" text-anchor="middle">DM9051 Core Driver</text><text class="s" x="550" y="342" text-anchor="middle">init, PHY, RX FIFO, TX FIFO, IRQ flag</text><text class="s" x="550" y="362" text-anchor="middle">bus_busy critical section</text>
  <rect class="hal" x="370" y="430" width="360" height="72"/><text class="t" x="550" y="459" text-anchor="middle">HAL / Port Layer</text><text class="s" x="550" y="482" text-anchor="middle">SPI1, GPIO CS/RST, EXTI, delay, critical</text>
  <rect class="hal" x="110" y="430" width="210" height="72"/><text class="t" x="215" y="459" text-anchor="middle">ISR</text><text class="s" x="215" y="482" text-anchor="middle">sets event flag only</text>
  <rect class="hal" x="780" y="430" width="210" height="72"/><text class="t" x="885" y="459" text-anchor="middle">Main Loop</text><text class="s" x="885" y="482" text-anchor="middle">polls input and timers</text>
  <rect class="chip" x="370" y="545" width="360" height="52"/><text class="t" x="550" y="577" text-anchor="middle">SPI / DMA / DM9051 Chip</text>
  <path class="a" d="M500 94 L360 145"/><path class="a" d="M600 94 L740 145"/>
  <path class="a" d="M300 219 L470 285"/><path class="a" d="M800 219 L630 285"/>
  <path class="a" d="M550 377 L550 430"/><path class="a" d="M550 502 L550 545"/>
  <path class="a" d="M215 430 C250 360 320 335 370 335"/><path class="a" d="M885 430 C850 360 780 335 730 335"/>
  <path class="a" d="M550 94 L550 285"/>
</svg>

