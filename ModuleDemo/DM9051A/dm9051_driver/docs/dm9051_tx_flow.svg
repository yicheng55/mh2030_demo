<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650">
  <style>.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:6}.c{fill:#ecfeff;stroke:#0e7490;stroke-width:2;rx:6}.h{fill:#fefce8;stroke:#a16207;stroke-width:2;rx:6}.x{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:6}.t{font:15px Arial;fill:#111827}.s{font:12px Arial;fill:#374151}.a{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#m)}</style>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs>
  <rect class="b" x="60" y="45" width="220" height="62"/><text class="t" x="170" y="72" text-anchor="middle">Application / Stack</text><text class="s" x="170" y="92" text-anchor="middle">uIP output or lwIP linkoutput</text>
  <rect class="c" x="380" y="45" width="250" height="62"/><text class="t" x="505" y="72" text-anchor="middle">dm9051_core_send</text><text class="s" x="505" y="92" text-anchor="middle">validate buf and len</text>
  <rect class="c" x="380" y="150" width="250" height="62"/><text class="t" x="505" y="177" text-anchor="middle">Acquire bus_busy</text><text class="s" x="505" y="197" text-anchor="middle">critical section</text>
  <rect class="h" x="380" y="255" width="250" height="62"/><text class="t" x="505" y="282" text-anchor="middle">Write TX length</text><text class="s" x="505" y="302" text-anchor="middle">TXPLL / TXPLH</text>
  <rect class="h" x="380" y="360" width="250" height="62"/><text class="t" x="505" y="387" text-anchor="middle">Burst write payload</text><text class="s" x="505" y="407" text-anchor="middle">MWCMD then frame bytes</text>
  <rect class="h" x="380" y="465" width="250" height="62"/><text class="t" x="505" y="492" text-anchor="middle">Set TXREQ</text><text class="s" x="505" y="512" text-anchor="middle">write TCR</text>
  <rect class="x" x="700" y="465" width="220" height="62"/><text class="t" x="810" y="492" text-anchor="middle">Wait / timeout</text><text class="s" x="810" y="512" text-anchor="middle">poll TCR up to 100000 us</text>
  <rect class="c" x="380" y="570" width="250" height="50"/><text class="t" x="505" y="601" text-anchor="middle">Release bus and return status</text>
